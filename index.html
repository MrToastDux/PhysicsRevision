<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f2"><title>Science Sprint · Grade 10</title>
<style>
:root{--ink:#20372e;--muted:#6b7971;--green:#2b7751;--lime:#d5f279;--line:#dce3d9;--paper:#fff;--bg:#f6f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}header{border-bottom:1px solid var(--line);background:#ffffffb8;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.top{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:19px 25px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.6px;font-size:21px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--green);color:var(--lime);font-size:24px}.stats{display:flex;gap:16px;font-size:14px;font-weight:700}.xp{color:var(--green)}main{max-width:1080px;margin:auto;padding:42px 25px 70px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;color:var(--green)}h1{font-size:clamp(32px,5vw,49px);line-height:1.12;letter-spacing:-1.8px;margin:13px 0 16px}h2{font-size:25px;letter-spacing:-.6px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.65}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:35px;align-items:center;margin-bottom:36px}.hero p{max-width:490px;margin-bottom:23px}.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:49px;background:var(--green);color:white;box-shadow:0 3px 0 #1c5136}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}.btn.small{padding:9px 14px;min-height:38px;font-size:13px}.heroart{min-height:230px;border-radius:28px;background:#e8eddf;position:relative;overflow:hidden;display:grid;place-items:center}.heroart svg{width:100%;max-width:330px}.artlabel{position:absolute;bottom:17px;left:20px;font-size:11px;letter-spacing:1px;font-weight:700}.sectionbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:29px 0 16px}.sectionbar h2{font-size:20px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.lesson{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;text-align:left;color:var(--ink);transition:transform .15s,border .15s;position:relative;min-height:155px}.lesson:hover{transform:translateY(-3px);border-color:var(--green)}.lesson.done{background:#f0f6e8}.lesson .num{display:inline-grid;place-items:center;width:33px;height:33px;border-radius:10px;background:#eef2e8;font-weight:800;font-size:13px;margin-bottom:16px}.lesson h3{padding-right:12px}.lesson .meta{font-size:12px;color:var(--muted)}.tick{position:absolute;right:18px;top:22px;color:var(--green);font-weight:bold}.practice{display:grid;grid-template-columns:1fr 1fr;gap:14px}.practice>div{border:1px solid var(--line);border-radius:17px;padding:23px;background:#eaf0e2}.practice p{font-size:14px;margin:8px 0 18px}.progress{height:9px;border-radius:20px;background:#e5e9e1;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);transition:width .25s;border-radius:20px}.overall{max-width:220px;width:40%}.overall p{font-size:12px;margin:7px 0 0;text-align:right}.study{max-width:740px;margin:auto}.crumb{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}.plain{border:0;background:none;color:var(--muted);padding:8px 0;font-weight:650}.panel{background:white;border:1px solid var(--line);border-radius:23px;padding:clamp(22px,4vw,38px);margin:22px 0}.panel p:first-child{margin-top:0}.formula{padding:17px 20px;border-radius:12px;background:#eef4e7;color:#28573e;font-family:Consolas,monospace;font-size:17px;font-weight:700;margin:19px 0;line-height:1.6}.note{font-size:14px;color:var(--muted);border-left:3px solid #b4ce86;padding-left:15px}.question{font-size:23px;line-height:1.45;letter-spacing:-.4px;margin:18px 0 24px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:white;border:2px solid var(--line);border-radius:13px;padding:14px 16px;color:var(--ink);min-height:57px}.choice .letter{background:#f2f4ef;border-radius:6px;min-width:27px;height:27px;display:grid;place-items:center;font-size:12px;font-weight:750}.choice.selected{border-color:var(--green);background:#f1f7eb}.choice.correct{border-color:#398656;background:#eef8ec}.choice.wrong{border-color:#c86454;background:#fff1ed}.numberrow{display:flex;align-items:center;gap:12px}input{width:100%;border:2px solid var(--line);padding:16px;border-radius:12px;outline:none;font-size:24px;color:var(--ink);min-width:0}input:focus{border-color:var(--green)}.unit{font-weight:700;white-space:nowrap}.feedback{padding:20px;border-radius:14px;background:#edf7e9;margin-top:20px;line-height:1.6}.feedback.bad{background:#fff0e9}.feedback strong{display:block;margin-bottom:5px}.feedback p{margin:0}.footerrow{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:25px}.tag{font-size:12px;color:var(--muted)}.result{text-align:center;padding:15px 0}.medal{width:86px;height:86px;display:grid;place-items:center;margin:0 auto 20px;border-radius:50%;background:var(--lime);font-size:40px}.resultstats{display:flex;justify-content:center;gap:35px;margin:28px 0}.resultstats b{font-size:26px;display:block}.resultstats span{font-size:12px;color:var(--muted)}.reviewitem{border-top:1px solid var(--line);padding:17px 0;text-align:left}.reviewitem p{margin:5px 0;font-size:14px}.bottomnote{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}.actions{display:flex;gap:10px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:720px){main{padding:26px 18px 50px}.top{padding:15px 18px}.brand{font-size:18px}.stats{gap:10px;font-size:12px}.hero{grid-template-columns:1fr;gap:22px}.heroart{display:none}.grid{grid-template-columns:1fr 1fr}.practice{grid-template-columns:1fr}.lesson{padding:16px;min-height:155px}.lesson h3{font-size:15px}.footerrow{align-items:stretch;flex-direction:column}.footerrow .btn{width:100%}.question{font-size:21px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="top"><div class="brand"><span class="logo">ϟ</span>science sprint<span class="sr">Grade 10 Physics</span></div><div class="stats"><span class="xp" id="xp">0 XP</span><span id="hearts" aria-label="Five hearts">♥ ♥ ♥ ♥ ♥</span></div></div></header><main id="app"></main>
<script>
const mc=(q,options,answer,why)=>({q,options,answer,why});
const num=(q,answer,unit,why,tolerance)=>({q,answer,unit,why,tolerance:tolerance??Math.max(Math.abs(answer)*.015,.005)});
const lessons=[
{title:'Transverse pulses',icon:'01',desc:'One disturbance. Big ideas.',text:'A pulse is a single disturbance in a medium. In a transverse pulse, particles vibrate perpendicular (at 90°) to the direction the pulse travels. Energy travels along the rope; the rope particles vibrate around their equilibrium positions.',formula:'Resultant displacement = y₁ + y₂',tip:'Add signed displacements when pulses overlap. Same direction: constructive interference. Opposite directions: destructive interference. Ideal pulses pass through each other and continue unchanged.',qs:[mc('A pulse travels right along a rope. How do the rope particles vibrate?',['Up and down','Right with the pulse','They stay completely still','Only to the left'],0,'Transverse means perpendicular: horizontal travel and vertical particle motion.'),mc('What is amplitude?',['Distance travelled by a pulse','Maximum particle displacement from equilibrium','Number of pulses per second','Time taken to move one metre'],1,'Measure amplitude from equilibrium to maximum displacement, not crest to trough.'),num('Two overlapping pulses have displacements +5 cm and −3 cm. Find the resultant displacement.',2,'cm','y = +5 + (−3) = +2 cm. The upward displacement is larger.'),mc('Two upward pulses overlap. What type of interference occurs?',['Destructive','Constructive','No interference','Reflection'],1,'Their positive displacements add, increasing the resultant displacement.'),mc('Equal, opposite pulses cancel momentarily. What happens next?',['Both vanish forever','They bounce backwards','They pass through and continue','The rope becomes permanently flat'],2,'Superposition is temporary. In the ideal model, pulses retain their original shapes and directions after overlap.')]},
{title:'Transverse waves',icon:'02',desc:'Read the rhythm of a wave.',text:'A transverse wave is a succession of transverse disturbances. Crests are highest points and troughs are lowest. Wavelength λ is the distance between successive points in phase, such as neighbouring crests. Frequency counts complete oscillations each second. Period is the time for one.',formula:'v = fλ     f = 1/T     f = N/Δt',tip:'On a displacement–distance graph, crest spacing gives wavelength. On a displacement–time graph, it gives period. First crest to fourth crest spans THREE wavelengths.',qs:[num('A source makes 15 complete oscillations in 3 s. Find its frequency.',5,'Hz','f = N/Δt = 15/3 = 5 Hz.'),num('A wave has frequency 5 Hz. Find its period.',.2,'s','T = 1/f = 1/5 = 0.20 s.'),num('The first crest to the fourth crest spans 1.8 m. Find the wavelength.',.6,'m','There are three crest-to-crest intervals: λ = 1.8/3 = 0.60 m.'),num('A wave has frequency 5 Hz and wavelength 0.6 m. Find its speed.',3,'m/s','v = fλ = 5 × 0.6 = 3 m/s.'),mc('Frequency doubles while wave speed stays constant. Wavelength…',['Doubles','Stays constant','Halves','Quadruples'],2,'λ = v/f. With v fixed, doubling f halves λ.')]},
{title:'Longitudinal waves',icon:'03',desc:'Compressions and rarefactions.',text:'In a longitudinal wave, particles vibrate parallel to the wave’s direction of travel. Compressions have particles close together: higher density and pressure. Rarefactions have particles farther apart: lower density and pressure.',formula:'v = fλ     λ = compression-to-next-compression',tip:'Amplitude is the maximum displacement of an individual particle. It is NOT the distance between compressions. A compression to its neighbouring rarefaction is half a wavelength.',qs:[mc('Particles in a longitudinal wave vibrate…',['Perpendicular to wave travel','Parallel to wave travel','In circles only','Without moving'],1,'Longitudinal = parallel. Think of pushing and pulling a spring along its length.'),mc('A compression is a region of…',['Low pressure and low density','High pressure and high density','Zero particles','Maximum wavelength'],1,'Particles are packed more closely in a compression.'),mc('One wavelength is the distance from…',['Compression centre to next rarefaction centre','Compression centre to next compression centre','One particle to the next particle','Rest position to maximum displacement'],1,'Successive compression centres are points in phase, separated by one wavelength.'),num('A longitudinal wave has speed 12 m/s and frequency 4 Hz. Find its wavelength.',3,'m','λ = v/f = 12/4 = 3 m.'),mc('Which describes the amplitude of a longitudinal wave?',['Maximum particle displacement from equilibrium','Width of a compression','Distance between rarefactions','Number of compressions per second'],0,'Amplitude always concerns how far a particle moves from its equilibrium position.')]},
{title:'Sound',icon:'04',desc:'Pitch, loudness and echoes.',text:'Sound in air is a longitudinal mechanical wave. It needs particles to pass vibrations along, so it cannot cross a vacuum. Higher frequency gives higher pitch; larger amplitude generally gives greater loudness. Timbre depends on waveform and harmonic content.',formula:'Echo distance = vΔt/2     v = fλ',tip:'Human hearing is approximately 20–20 000 Hz. Ultrasound is above 20 000 Hz; infrasound is below 20 Hz. Echo time includes the outward AND return trip.',qs:[mc('A sound’s frequency increases. What increases?',['Pitch','Amplitude automatically','Loudness automatically','Speed automatically'],0,'Pitch is related to frequency. Loudness is mainly connected to amplitude/intensity.'),mc('Why can sound not travel through a vacuum?',['It is too cold','There are no particles to carry vibrations','There is no gravity','Its frequency becomes zero'],1,'A mechanical wave needs a material medium.'),num('An echo returns after 0.8 s. Sound speed is 340 m/s. How far away is the cliff?',136,'m','d = vΔt/2 = 340 × 0.8 / 2 = 136 m.'),mc('A sound at 25 000 Hz is…',['Infrasound','Within the usual human hearing range','Ultrasound','An electromagnetic wave'],2,'Ultrasound has frequency above 20 000 Hz.'),num('Sound speed is 340 m/s and frequency is 680 Hz. Find wavelength.',.5,'m','λ = v/f = 340/680 = 0.50 m.')]},
{title:'EM radiation',icon:'05',desc:'From radio waves to photons.',text:'Electromagnetic waves are transverse oscillating electric and magnetic fields. They need no material medium. All travel at c = 3 × 10⁸ m/s in a vacuum. Increasing frequency order: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.',formula:'c = fλ     E = hf = hc/λ\nh = 6.63 × 10⁻³⁴ J·s',tip:'Higher frequency means greater energy per photon and shorter wavelength. Convert nm to m by multiplying by 10⁻⁹. Gamma rays and radio waves have the SAME vacuum speed.',qs:[mc('Which has the highest energy per photon?',['Radio','Infrared','Visible','Gamma'],3,'E = hf, so the highest frequency gives the greatest photon energy.'),mc('Which can travel through a vacuum?',['Sound only','EM radiation only','Both sound and EM radiation','Neither'],1,'EM fields can propagate without particles. Sound needs particles.'),num('Light wavelength is 500 nm. Find frequency in units of 10¹⁴ Hz: enter the coefficient only.',6,'× 10¹⁴ Hz','500 nm = 500 × 10⁻⁹ m. f = (3 × 10⁸)/(500 × 10⁻⁹) = 6 × 10¹⁴ Hz.'),num('A photon has frequency 6 × 10¹⁴ Hz. Find energy in units of 10⁻¹⁹ J: enter the coefficient.',3.978,'× 10⁻¹⁹ J','E = hf = (6.63 × 10⁻³⁴)(6 × 10¹⁴) = 3.978 × 10⁻¹⁹ J.'),mc('If wavelength doubles, energy per photon…',['Doubles','Halves','Stays constant','Quadruples'],1,'E = hc/λ: photon energy is inversely proportional to wavelength.')]},
{title:'Electrostatics',icon:'06',desc:'Electrons, charge and sharing.',text:'Objects gain electrons to become negative and lose electrons to become positive. Like charges repel; unlike charges attract. A charged object can attract a neutral object by polarisation. Charge transfers but the total charge of an isolated system remains constant.',formula:'Identical spheres: Qfinal = (Q₁ + Q₂)/2\nElectron count: n = |ΔQ|/e\ne = 1.6 × 10⁻¹⁹ C',tip:'Only identical isolated conducting spheres share charge equally in this model. For electrons transferred, use CHANGE in charge. Neutral objects still contain positive and negative charges.',qs:[mc('A neutral object becomes positive when it…',['Gains electrons','Loses electrons','Gains neutrons','Loses ordinary protons by rubbing'],1,'Positive charge means an electron deficit. Electrons move in ordinary charging.'),num('Identical spheres carry +8 nC and −4 nC. They touch and separate. What is each final charge?',2,'nC','Total charge = +8 − 4 = +4 nC. Shared equally: +2 nC each.'),mc('In that example, electrons move…',['From the +8 nC sphere to the −4 nC sphere','From the −4 nC sphere to the +8 nC sphere','In neither direction','From the insulating stands'],1,'The +8 nC sphere gains electrons to reach +2 nC. The −4 nC sphere loses electrons to reach +2 nC.'),num('Transferred charge magnitude is 6 nC. How many electrons transfer, in units of 10¹⁰ electrons?',3.75,'× 10¹⁰','n = (6 × 10⁻⁹)/(1.6 × 10⁻¹⁹) = 3.75 × 10¹⁰ electrons.'),mc('A charged balloon attracts neutral paper because…',['The paper has no charges','Charges in the paper polarise','Protons leave all the paper atoms','Charge is created from nothing'],1,'Charge rearrangement makes the nearer side relatively opposite in charge, producing a net attraction.')]},
{title:'Circuit foundations',icon:'07',desc:'Charge flows. Energy transfers.',text:'Current is charge passing a point per second. Potential difference is energy transferred per coulomb. A battery supplies energy; components transfer it into heat, light and other forms. Current is not used up. EMF is energy supplied per coulomb; terminal voltage is measured across a battery supplying current.',formula:'I = Q/Δt     V = W/Q     R = V/I',tip:'Ammeter: series, ideally zero resistance. Voltmeter: parallel, ideally infinite resistance. Conventional current travels from + to − through the external circuit; electron drift is opposite.',qs:[num('18 C passes a point in 6 s. Find current.',3,'A','I = Q/Δt = 18/6 = 3 A.'),num('A component transfers 60 J when 5 C passes through it. Find potential difference.',12,'V','V = W/Q = 60/5 = 12 V. Each coulomb transfers 12 J.'),mc('To measure current through a lamp, connect an ammeter…',['In series','In parallel','Across the battery only','Outside the circuit'],0,'The measured current must pass through the ammeter.'),mc('To measure voltage across a resistor, connect a voltmeter…',['In series','In parallel','In place of the battery','With no connections'],1,'Connect the meter to the resistor’s two ends.'),mc('Why does a battery eventually go flat?',['Its electrons are all used up','Its available chemical energy is depleted','Current disappears inside the wires','Positive charge is destroyed'],1,'A battery converts chemical potential energy. Charges circulate rather than being consumed.')]},
{title:'Series & parallel',icon:'08',desc:'Solve a circuit in small steps.',text:'Series components share one path: same current, divided voltage, resistances add. Parallel components connect across the same two junctions: same voltage, divided current, smaller equivalent resistance. For a mixed circuit, simplify the parallel group first.',formula:'Series: Rs = R₁ + R₂\nParallel: 1/Rp = 1/R₁ + 1/R₂\nTwo in parallel: Rp = R₁R₂/(R₁ + R₂)',tip:'For the questions: a 12 V ideal battery supplies a 2 Ω resistor in series with a parallel pair of 6 Ω and 3 Ω. Start inside the parallel group, then work outwards.',qs:[num('Find equivalent resistance of 6 Ω and 3 Ω in parallel.',2,'Ω','Rp = (6 × 3)/(6 + 3) = 18/9 = 2 Ω.'),num('Add the 2 Ω series resistor. What is total resistance?',4,'Ω','Rtotal = 2 + Rp = 2 + 2 = 4 Ω.'),num('The battery is 12 V and total resistance is 4 Ω. Find total current.',3,'A','I = V/R = 12/4 = 3 A.'),num('Total current is 3 A. Find voltage across the 2 Ω series resistor.',6,'V','V = IR = 3 × 2 = 6 V. The parallel group gets the remaining 12 − 6 = 6 V.'),num('The parallel group has 6 V across it. Find current in its 3 Ω branch.',2,'A','Each parallel branch has 6 V. I = V/R = 6/3 = 2 A.')]},
{title:'Vectors & scalars',icon:'09',desc:'Size, direction and resultants.',text:'A scalar has magnitude only, such as mass, time, speed, distance or energy. A vector has magnitude and direction, such as displacement, velocity, acceleration or force. A resultant is the single vector with the same effect as the combined vectors.',formula:'Choose a positive direction → add signed vectors',tip:'For a scale drawing, place vectors tail-to-head. The resultant runs from the first tail to the final head. Negative charge is a scalar: its sign is charge type, not a spatial direction.',qs:[mc('Which is a vector?',['Distance','Speed','Displacement','Energy'],2,'Displacement gives a change in position with a direction.'),mc('Which is a scalar?',['Acceleration','Velocity','Force','Mass'],3,'Mass has magnitude only. The other three need direction.'),num('Take east as positive. Forces are 18 N east, 7 N west and 4 N west. Find signed resultant.',7,'N','F = +18 − 7 − 4 = +7 N, or 7 N east.'),mc('Two equal vectors must have…',['Same magnitude only','Same direction only','Same magnitude and direction','Opposite directions'],2,'Both size and direction determine a vector.'),mc('The negative of a vector has…',['Half its magnitude','Same magnitude and opposite direction','Zero magnitude','The same direction'],1,'To subtract a vector, add a vector equal in magnitude but opposite in direction.')]},
{title:'Motion in one dimension',icon:'10',desc:'Distance is not displacement.',text:'Choose an origin and positive direction. Position locates an object relative to the origin. Distance is total path length; displacement is final position minus initial position. Average speed uses distance. Average velocity uses displacement.',formula:'Δx = xf − xi\nAverage speed = distance/time\nAverage velocity = displacement/time',tip:'Walk 30 m east and 10 m west in 20 s: distance = 40 m, displacement = 20 m east. Returning to the start gives zero displacement even if you travelled a long way.',qs:[num('Walk 30 m east and 10 m west. What is the distance travelled?',40,'m','Distance adds path lengths: 30 + 10 = 40 m.'),num('For the same walk, take east positive. Find signed displacement.',20,'m','Δx = +30 − 10 = +20 m, or 20 m east.'),num('The 40 m walk takes 20 s. Find average speed.',2,'m/s','Average speed = total distance/total time = 40/20 = 2 m/s.'),num('Displacement is 20 m east over 20 s. Find signed average velocity.',1,'m/s','Average velocity = displacement/time = 20/20 = +1 m/s, east.'),num('Convert 72 km/h to m/s.',20,'m/s','Divide by 3.6: 72/3.6 = 20 m/s.')]},
{title:'Acceleration & equations',icon:'11',desc:'Choose signs. Choose a formula.',text:'Acceleration is change in velocity per unit time. If velocity and acceleration have the same sign, speed increases. Opposite signs mean slowing down. The equations below apply only when acceleration is constant during the interval.',formula:'a = (vf − vi)/Δt\nvf = vi + aΔt\nΔx = viΔt + ½aΔt²\nvf² = vi² + 2aΔx',tip:'Starts from rest: vi = 0. Stops: vf = 0. No time given? Try vf² = vi² + 2aΔx. Split accelerating, cruising and braking into separate intervals.',qs:[num('A car starts from rest and accelerates at +3 m/s² for 4 s. Find final velocity.',12,'m/s','vf = vi + at = 0 + 3 × 4 = +12 m/s.'),num('For the same car, find displacement during those 4 s.',24,'m','Δx = vi t + ½at² = 0 + ½ × 3 × 4² = 24 m.'),num('A car slows from +20 m/s to rest over +50 m. Find signed acceleration.',-4,'m/s²','vf² = vi² + 2aΔx. 0 = 400 + 100a, so a = −4 m/s².'),num('The car has vi = +20 m/s and a = −4 m/s². How long until it stops?',5,'s','0 = 20 − 4t, so t = 5 s.'),mc('Velocity is negative and acceleration is negative. The object is…',['Slowing down','Speeding up','Definitely at rest','Moving at constant speed'],1,'The signs match. Velocity becomes more negative, so its magnitude increases.')]},
{title:'Motion graphs',icon:'12',desc:'Gradients and areas unlock marks.',text:'Position–time graph: gradient gives velocity. Velocity–time graph: gradient gives acceleration; signed area gives displacement. Add area magnitudes for distance. Acceleration–time graph: signed area gives change in velocity.',formula:'Gradient = vertical change / horizontal change\nTriangle area = ½ × base × height',tip:'A velocity–time line below zero means negative motion, not necessarily slowing down. A horizontal position–time line means rest. A horizontal nonzero velocity–time line means constant motion.',qs:[mc('The gradient of a position–time graph gives…',['Distance','Velocity','Acceleration','Energy'],1,'Position change divided by time change is velocity.'),mc('Signed area under a velocity–time graph gives…',['Displacement','Acceleration','Speed only','Position gradient'],0,'Areas above zero are positive displacements; below zero are negative.'),num('Velocity rises uniformly from 0 to +8 m/s over 4 s. Find acceleration.',2,'m/s²','Gradient = (8 − 0)/(4 − 0) = +2 m/s².'),num('Find displacement for that triangular velocity–time region: base 4 s, height 8 m/s.',16,'m','Area = ½ × 4 × 8 = +16 m.'),num('Positive v–t area is +56 m and negative area is −4 m. Find total distance.',60,'m','Distance adds magnitudes: 56 + 4 = 60 m. Displacement would be 56 − 4 = 52 m.')]},
{title:'Energy',icon:'13',desc:'Follow the energy, find the speed.',text:'Kinetic energy comes from motion. Gravitational potential energy comes from position in a gravitational field relative to a reference level. Mechanical energy is their sum. It stays constant when only gravity does work and friction/air resistance are absent.',formula:'Ek = ½mv²     Ep = mgh\nEk(initial) + Ep(initial) = Ek(final) + Ep(final)\ng = 9.8 m/s²',tip:'Use vertical height, not slope length. Friction reduces mechanical energy by transferring it to other forms; total energy is still conserved. Doubling speed quadruples kinetic energy.',qs:[num('A 2 kg object moves at 3 m/s. Find kinetic energy.',9,'J','Ek = ½mv² = ½ × 2 × 3² = 9 J.'),num('A 0.5 kg ball is 10 m above the reference level. Find gravitational potential energy.',49,'J','Ep = mgh = 0.5 × 9.8 × 10 = 49 J.'),num('That ball starts from rest at 10 m. At 4 m, its potential energy is 19.6 J. Ignoring air resistance, find kinetic energy.',29.4,'J','Mechanical energy stays 49 J. Ek = 49 − 19.6 = 29.4 J.'),num('The 0.5 kg ball has kinetic energy 29.4 J. Find its speed.',10.844,'m/s','29.4 = ½ × 0.5 × v². v = √117.6 = 10.84 m/s.'),mc('With air resistance, the ball’s speed at 4 m would be…',['Greater','Smaller','Exactly unchanged','Zero in every case'],1,'Some mechanical energy transfers into thermal energy, leaving less kinetic energy at that height.')]}
];
lessons.forEach((l,i)=>l.qs.forEach((q,j)=>{q.id=i+'-'+j;q.lesson=i}));
const bank=lessons.flatMap(l=>l.qs),key='science-sprint-g10-v1';let saved={xp:0,earned:[],best:{},mistakes:[]};try{const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.earned)&&Array.isArray(x.mistakes)&&x.best&&Number.isFinite(x.xp))saved=x}catch{}let session=null,selection=null,answered=false,good=false,stage='home';
const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}
function header(){document.querySelector('#xp').textContent=saved.xp+' XP';const h=session?session.hearts:5;document.querySelector('#hearts').textContent='♥ '.repeat(h)+'♡ '.repeat(5-h);document.querySelector('#hearts').setAttribute('aria-label',h+' out of 5 hearts')}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function home(){stage='home';session=null;header();const done=Object.values(saved.best).filter(v=>v===5).length;app.innerHTML=`<section class="hero"><div><div class="eyebrow">South Africa · Grade 10 · Physics</div><h1>Small lessons.<br>Big exam energy.</h1><p class="muted">A little learning, a little practice, a lot more confidence. Take one topic at a time and make the marks yours.</p><button class="btn" onclick="startLesson(${Math.max(0,lessons.findIndex((_,i)=>saved.best[i]!==5))})">Let's learn <span>→</span></button></div><div class="heroart" aria-hidden="true"><svg viewBox="0 0 330 230"><circle cx="170" cy="110" r="80" fill="#d5f279"/><ellipse cx="170" cy="110" rx="106" ry="35" fill="none" stroke="#2b7751" stroke-width="2" transform="rotate(-35 170 110)"/><ellipse cx="170" cy="110" rx="106" ry="35" fill="none" stroke="#2b7751" stroke-width="2" transform="rotate(35 170 110)"/><ellipse cx="170" cy="110" rx="106" ry="35" fill="none" stroke="#2b7751" stroke-width="2" transform="rotate(90 170 110)"/><circle cx="170" cy="110" r="20" fill="#2b7751"/><circle cx="170" cy="110" r="6" fill="#d5f279"/><circle cx="85" cy="58" r="8" fill="#2b7751"/><circle cx="240" cy="167" r="8" fill="#2b7751"/><path d="M42 180l9-19 9 19M45 175h12" stroke="#2b7751" stroke-width="2" fill="none"/></svg><span class="artlabel">ONE GOOD ANSWER AT A TIME.</span></div></section><div class="sectionbar"><h2>Your learning path</h2><div class="overall"><div class="progress"><span style="width:${done/lessons.length*100}%"></span></div><p>${done} / ${lessons.length} topics mastered</p></div></div><div class="grid">${lessons.map((l,i)=>`<button class="lesson ${saved.best[i]===5?'done':''}" onclick="startLesson(${i})"><span class="num">${l.icon}</span>${saved.best[i]===5?'<span class="tick">✓</span>':''}<h3>${l.title}</h3><span class="meta">${saved.best[i]!==undefined?'Best '+saved.best[i]+'/5 · ':''}5 questions · ~3 min</span></button>`).join('')}</div><div class="sectionbar"><h2>A little extra practice</h2></div><div class="practice"><div><h3>Mix it up</h3><p class="muted">20 questions across all 13 topics. Definitions, calculations and instant worked answers.</p><button class="btn secondary small" onclick="startMixed()">Start exam practice →</button></div><div><h3>Make mistakes work for you</h3><p class="muted">${saved.mistakes.length?`${saved.mistakes.length} question${saved.mistakes.length===1?'':'s'} to revisit. Try again with a fresh set of hearts.`:'Missed answers will appear here. Every mistake is another chance to learn.'}</p><button class="btn secondary small" ${saved.mistakes.length?'':'disabled'} onclick="startReview()">Review mistakes →</button></div></div><p class="bottomnote">Progress saves in this browser. No login needed. <button class="plain" style="font-size:12px" onclick="resetProgress()">Reset progress</button></p>`}
function startLesson(i){const l=lessons[i];session={type:'lesson',lesson:i,title:l.title,qs:l.qs,at:0,correct:0,hearts:5,answers:[],xp:0};stage='intro';header();app.innerHTML=`<div class="study"><div class="crumb"><button class="plain" onclick="home()">← Learning path</button><span class="tag">LESSON ${i+1} OF ${lessons.length}</span></div><div class="eyebrow">Read it. Try it. Remember it.</div><h1 style="font-size:38px">${l.title}</h1><div class="panel"><p>${l.text}</p><div class="formula">${l.formula.replace(/\n/g,'<br>')}</div><p class="note">${l.tip}</p></div><div class="footerrow"><span class="tag">5 questions · +10 XP per new correct answer</span><button class="btn" onclick="showQuestion()">Got it. Let's practise →</button></div></div>`;window.scrollTo(0,0)}
function startMixed(){let sampled=lessons.map(l=>shuffle(l.qs)[0]);const ids=new Set(sampled.map(q=>q.id));sampled.push(...shuffle(bank.filter(q=>!ids.has(q.id))).slice(0,7));startSession('mixed','Exam practice',shuffle(sampled))}
function startReview(){const qs=bank.filter(q=>saved.mistakes.includes(q.id));if(!qs.length){home();return}startSession('review','Mistake practice',shuffle(qs))}
function startSession(type,title,qs){session={type,title,qs,at:0,correct:0,hearts:5,answers:[],xp:0};showQuestion()}
function showQuestion(){stage='question';selection=null;answered=false;const q=session.qs[session.at];header();app.innerHTML=`<div class="study"><div class="crumb"><button class="plain" onclick="home()">← Learning path</button><span class="tag">${session.at+1} / ${session.qs.length}</span></div><div class="progress"><span style="width:${session.at/session.qs.length*100}%"></span></div><div class="panel"><div class="eyebrow">${lessons[q.lesson].title} · ${q.options?'Choose one':'Calculate it'}</div><h2 class="question">${esc(q.q)}</h2>${q.options?`<div class="choices">${q.options.map((o,i)=>`<button class="choice" id="choice${i}" aria-pressed="false" onclick="selectAnswer(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`:`<label class="sr" for="number">Your numerical answer</label><div class="numberrow"><input type="text" inputmode="decimal" id="number" placeholder="Your answer" autocomplete="off" oninput="document.querySelector('#check').disabled=!this.value.trim()"><span class="unit">${esc(q.unit)}</span></div><p class="tag">Enter a number only. A decimal comma or point is fine.</p>`}<div id="feedback" aria-live="polite"></div><div class="footerrow"><button class="plain" onclick="toggleHint()" id="hintbtn">Need a reminder?</button><button class="btn" id="check" disabled onclick="checkAnswer()">Check answer</button></div><div id="hint"></div></div></div>`;window.scrollTo(0,0)}
function selectAnswer(i){if(answered)return;selection=i;document.querySelectorAll('.choice').forEach((b,j)=>{b.classList.toggle('selected',j===i);b.setAttribute('aria-pressed',String(j===i))});document.querySelector('#check').disabled=false}
function toggleHint(){const h=document.querySelector('#hint');const l=lessons[session.qs[session.at].lesson];h.innerHTML=h.innerHTML?'':`<div class="formula">${l.formula.replace(/\n/g,'<br>')}</div><p class="note">${l.tip}</p>`}
function parseAnswer(raw){const s=raw.trim().replace(/,/g,'.');if(!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(s))return NaN;return Number(s)}
function checkAnswer(){if(answered)return;const q=session.qs[session.at];let value=q.options?selection:parseAnswer(document.querySelector('#number').value);if(q.options&&value===null)return;if(!q.options&&!Number.isFinite(value)){document.querySelector('#feedback').innerHTML='<p role="alert">Enter a valid number, such as 0.5 or −4 (use the keyboard minus sign).</p>';return}answered=true;good=q.options?value===q.answer:Math.abs(value-q.answer)<=q.tolerance;session.answers.push({q,value,good});if(good){session.correct++;saved.mistakes=saved.mistakes.filter(id=>id!==q.id);if(!saved.earned.includes(q.id)){saved.earned.push(q.id);saved.xp+=10;session.xp+=10}}else{session.hearts--;if(!saved.mistakes.includes(q.id))saved.mistakes.push(q.id)}persist();header();if(q.options){document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.classList.remove('selected');if(i===q.answer)b.classList.add('correct');else if(i===value)b.classList.add('wrong')})}else document.querySelector('#number').disabled=true;document.querySelector('#feedback').innerHTML=`<div class="feedback ${good?'':'bad'}"><strong>${good?'✓ Nice work!':'Almost. Let’s work through it.'}</strong>${!good?`<p>Correct answer: <b>${q.options?esc(q.options[q.answer]):esc(q.answer+' '+q.unit)}</b></p>`:''}<p>${esc(q.why)}</p>${session.hearts===0?'<p><b>Out of hearts? Read the explanation, then refill and carry on. Learning stays open.</b></p>':''}</div>`;const b=document.querySelector('#check');b.disabled=false;b.textContent=session.at===session.qs.length-1?'See results →':session.hearts===0?'Refill hearts & continue →':'Continue →';b.onclick=nextQuestion;document.querySelector('#hintbtn').hidden=true}
function nextQuestion(){if(!answered)return;if(session.hearts===0)session.hearts=5;session.at++;if(session.at>=session.qs.length)finish();else showQuestion()}
function finish(){stage='result';if(session.type==='lesson'){saved.best[session.lesson]=Math.max(saved.best[session.lesson]||0,session.correct);persist()}header();const missed=session.answers.filter(a=>!a.good);app.innerHTML=`<div class="study"><div class="panel result"><div class="medal">${missed.length?'✦':'✓'}</div><div class="eyebrow">${session.title} complete</div><h1 style="font-size:36px">${missed.length?'A little stronger already.':'That’s a clean sweep.'}</h1><p class="muted">${missed.length?'Read the methods below, then give the tricky ones another go.':'You got every question right. Keep the momentum going.'}</p><div class="resultstats"><div><b>${session.correct}/${session.qs.length}</b><span>CORRECT</span></div><div><b>+${session.xp}</b><span>NEW XP</span></div></div><div class="actions" style="justify-content:center"><button class="btn" onclick="home()">Back to learning path</button>${missed.length?'<button class="btn secondary" onclick="retrySession()">Retry missed questions</button>':session.type==='lesson'&&session.lesson<lessons.length-1?`<button class="btn secondary" onclick="startLesson(${session.lesson+1})">Next lesson →</button>`:''}</div>${missed.length?'<h3 style="text-align:left;margin-top:32px">Your worked answers</h3>'+missed.map(a=>`<div class="reviewitem"><b>${esc(a.q.q)}</b><p class="muted">Your answer: ${esc(a.q.options?a.q.options[a.value]:a.value+' '+a.q.unit)}</p><p><b>Correct: ${esc(a.q.options?a.q.options[a.q.answer]:a.q.answer+' '+a.q.unit)}</b></p><p>${esc(a.q.why)}</p></div>`).join(''):''}</div></div>`;window.scrollTo(0,0)}
function retrySession(){const missed=session.answers.filter(a=>!a.good).map(a=>a.q);startSession('review','Retry practice',missed)}
function resetProgress(){if(!confirm('Reset all XP, lesson scores and saved mistakes in this browser?'))return;saved={xp:0,earned:[],best:{},mistakes:[]};persist();home()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&stage==='question'){const b=document.querySelector('#check');if(b&&!b.disabled){e.preventDefault();b.click()}}if(stage==='question'&&!answered&&/^[1-4]$/.test(e.key)&&document.activeElement?.tagName!=='INPUT'){const q=session.qs[session.at];if(q.options)selectAnswer(Number(e.key)-1)}});home();
</script></body></html>
